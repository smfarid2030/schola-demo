 const r=ReviewModel.fixture('new-version',account==='personal'?'personal':role==='org_admin'?'org_admin':'org_teacher');r.id=id('correction');r.account=account;r.title=C.correctionWork;r.balance=wallet.available;if(new URLSearchParams(location.search).get('permission')==='correction'&&account!=='personal'){r.status='waiting';r.correctionGrant={active:true,teacherId:'teacher-me',reviewId:r.id,jobId:r.jobId||r.id};r.memberBudget={limit:400,spent:144,held:83,remaining:173}}const reviewKey=ScholaStorage.key('review',account,r.id);if(!localStorage.getItem(reviewKey))localStorage.setItem(reviewKey,JSON.stringify(r));
}
function href(kind){if(!['main','partial','running','correction','extra'].includes(kind))return 'job.html?account='+param+'&job='+encodeURIComponent(kind)+'&step=10';return kind==='correction'?'review-detail.html?scope='+(account==='personal'?'personal':role==='org_admin'?'org_admin':'org_teacher')+'&review='+id(kind):'job.html?account='+param+'&job='+id(kind)+'&step='+(kind==='running'?10:11)}
function workName(kind){if(!['main','partial','running','correction','extra'].includes(kind)){try{return JSON.parse(localStorage.getItem(ScholaStorage.key('job',account,kind)))?.title||'নমুনা নতুন কাজ'}catch{return 'নমুনা নতুন কাজ'}}if(state==='long'&&kind==='main')return C.longWork;return{main:C.mainWork,partial:C.partialWork,running:C.runningWork,correction:C.correctionWork,extra:C.extraWork}[kind]||C.accountEntry}
window.M10Demo={bn,esc,time,seedJobs,href,workName,id};
})();

(()=>{
const M=LibraryModel,{bn,esc,time,seedJobs,href,workName}=M10Demo,account=AppShell.account,key=ScholaStorage.key('library',account);let view=state,data=M.fixture(account,state),query='',visible=10,candidates=[],ownership=false,uploadBusy=false,message='',deleteFileId=null,deleteBusy=false,deleteMessage='';
const wallet=AccountPolicy.wallet(account);seedJobs(wallet);const fileObjects=new Map();
if(!new URLSearchParams(location.search).has('state'))try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved){data.own=saved.filter(f=>f.account===account&&f.ownerId==='me');for(const f of data.own)if(f.status==='uploading')f.status='failed'}}catch{}
active='sources';currentAccount=account==='personal'?C.personalAccount:C.institutionAccount;updateAccount();renderNav();
function activeRefs(f){if(!f)return [];const jobs=[],drafts=[],reviews=[];try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(![ScholaStorage.key('job',account),ScholaStorage.key('draft',account),ScholaStorage.key('review',account)].some(p=>key.startsWith(p)))continue;const raw=JSON.parse(localStorage.getItem(key));if(key.startsWith(ScholaStorage.key('job',account)))jobs.push(raw);else if(key.startsWith(ScholaStorage.key('draft',account))){if(raw?.draft)drafts.push(raw.draft)}else if(key.startsWith(ScholaStorage.key('review',account)))reviews.push(raw)}}catch{}return M.activeRefs(f,jobs,drafts,reviews,account)}
function canDelete(f){if(!f)return false;return M.canDelete({...f,activeJobs:activeRefs(f)},account)}
function useLink(f){const r=activeRefs(f)[0];return !r||r.kind==='fixture'?href('running'):r.kind==='review'?'review-detail.html?scope='+(account==='personal'?'personal':'org_teacher')+'&review='+encodeURIComponent(r.id):'job.html?account='+AppShell.param+'&job='+encodeURIComponent(r.id)+'&step=10'}
function useName(f){return activeRefs(f)[0]?.title||C.runningWork}
const inUse=f=>activeRefs(f).length>0,mb=f=>bn(f.size/1000000)+' MB',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function save(){localStorage.setItem(key,JSON.stringify(data.own))}
function status(f){return f.status==='ready'?C.ready:['uploading','queued'].includes(f.status)?C.uploading:f.status==='failed'?C.uploadFailed:f.error==='size'?C.overLimit:C.wrongType}
function flag(f){return `${icon(f.privateFlag?'Check':'X')}<span>${f.privateFlag?C.checked:C.unchecked}</span>`}
function metadata(f){return `<dl class="file-metadata"><dt>${C.flag}</dt><dd class="flag-value">${flag(f)}</dd><dt>${C.uploader}</dt><dd>${esc(f.uploader)}</dd><dt>${f.status==='ready'?C.when:C.pendingWhen}</dt><dd>${time(f.uploadedAt)}</dd><dt>${C.institution}</dt><dd>${esc(f.institution||C.noInstitution)}</dd><dt>${C.size}</dt><dd>${mb(f)}</dd></dl>`}
function actions(f,layout='card'){if(f.status==='ready')return `<div class="file-actions"><button class="button" data-own-view="${f.id}" aria-label="${C.view}: ${esc(f.name)}">${C.view}</button><button class="button" data-delete="${f.id}" ${inUse(f)?'disabled aria-describedby="used-'+f.id+'-'+layout+'"':''} aria-label="${C.delete}: ${esc(f.name)}">${C.delete}</button></div>${inUse(f)?`<p class="file-warning" id="used-${f.id}-${layout}">${C.inUse}<a class="text-link" href="${useLink(f)}">${C.inUseWork} ${esc(useName(f))}</a></p>`:''}`;return `<p class="file-status ${f.status==='failed'||f.status==='invalid'?'error':''}" role="status">${status(f)}</p><div class="file-actions">${f.status==='failed'?`<button class="button" data-upload-retry="${f.id}">${C.uploadAgain}</button>`:f.status==='invalid'?`<button class="button" data-select-other="${f.id}">${C.selectOther}</button>`:''}${f.status!=='uploading'?`<button class="button ghost" data-remove-candidate="${f.id}">${C.removeCandidate}</button>`:''}</div>`}
function ownCard(f){return `<article class="upload-card"><h3>${esc(f.name)}</h3>${metadata(f)}${actions(f)}</article>`}
function empty(t,h='',withArt=true){return `<section class="empty-state">${withArt?`<img src="${EMPTY_ASSET}" alt="" width="109" height="169">`:''}<h3>${t}</h3><p>${h}</p></section>`}
function body(){if(view==='no-permission')return `<div class="page-error" role="alert"><h2>${C.noPermission}</h2><button class="button" data-panel="accounts">${C.chooseAccount}</button></div>`;if(view==='loading')return `<p role="status">${C.loading}</p><div class="skeleton-card" aria-hidden="true"><div class="skeleton"></div><div class="skeleton short"></div></div>`;if(view==='error')return `<div class="page-error" role="alert"><p>${C.error}</p><button class="button" id="data-retry">${C.retry}</button></div>`;
 const platform=M.visiblePlatform(data.platform,data.entitlements,query),own=M.visibleOwn(data.own,account,query),shown=own.slice(0,visible);return `<p class="page-help">${C.libraryHelp}</p><button class="button primary" id="add-file">${C.addFile}</button><form id="library-search" class="library-search"><label for="library-query">${C.searchLabel}</label><div><input id="library-query" type="search" value="${esc(query)}"><button class="button" type="submit">${C.search}</button></div></form><p class="page-message" id="library-message" role="status">${message}</p><section class="library-section" aria-labelledby="platform-heading"><h2 id="platform-heading">${C.platformTitle}</h2><p>${C.platformHelp}</p>${platform.length?`<div class="platform-grid">${platform.map(f=>`<article class="source-card"><h3>${esc(f.name)}</h3><p class="meta">${f.kind} · ${C.grade6} · ${f.subject}</p><p class="readonly-label">${C.readOnly}</p><button class="button" data-platform-view="${f.id}" aria-label="${C.view}: ${esc(f.name)}">${C.view}</button></article>`).join('')}</div>`:empty(C.noPlatform,'',false)}</section><section class="library-section" aria-labelledby="own-heading"><h2 id="own-heading">${C.ownTitle}</h2><p>${C.ownHelp}</p><p>${C.flag} “${C.ownershipLabel}”</p><p class="sample-limit">${C.sampleLimit} ${C.limitHelp}</p>${shown.length?`<div class="phone-cards">${shown.map(ownCard).join('')}</div><div class="desktop-table"><table><caption>${C.ownTitle}</caption><thead><tr><th>${C.fileName}</th><th>${C.flag}</th><th>${C.fileMeta}</th><th>${C.actions}</th></tr></thead><tbody>${shown.map(f=>`<tr><td><h3>${esc(f.name)}</h3><p class="meta">${mb(f)}</p></td><td><span class="flag-value">${flag(f)}</span></td><td><p>${C.uploader} ${esc(f.uploader)}</p><p>${f.status==='ready'?C.when:C.pendingWhen} ${time(f.uploadedAt)}</p><p>${C.institution} ${esc(f.institution||C.noInstitution)}</p></td><td>${actions(f,'table')}</td></tr>`).join('')}</tbody></table></div>${shown.length<own.length?`<button class="button" id="more-files">${C.more}</button>`:''}`:empty(query?C.noSourceMatches:C.noOwn,C.noOwnHelp)}</section>`}
function paint(){ $('#page-title').textContent=C.libraryTitle;$('#page-demo').textContent=C.demo;$('#workspace').innerHTML=body();$('#workspace').setAttribute('aria-busy',view==='loading'?'true':'false');if(!['loading','error','no-permission'].includes(view)){$('#credit').innerHTML=icon('Wallet')+`<span>${bn(AccountPolicy.view(account).remaining)} ${C.credit}</span>`;$('#credit').setAttribute('aria-label',C.available+' '+bn(AccountPolicy.view(account).remaining)+' '+C.credit)}AppShell.refresh();}
function uploadPanel(){ $('#upload-title').textContent=C.addFile;$('#upload-body').innerHTML=`<p class="sample-limit">${C.sampleLimit} ${C.limitHelp}</p><p class="meta">${C.uploadDemo}</p><label class="file-picker" for="new-files">${C.chooseFiles}<input id="new-files" type="file" multiple accept="application/pdf,image/png,image/jpeg" aria-label="${C.chooseFiles}"></label><label class="check-row"><input id="ownership-check" type="checkbox" ${ownership?'checked':''} ${uploadBusy?'disabled':''}><span>${C.ownershipLabel}</span></label><ul class="candidate-list">${candidates.map(f=>`<li>${esc(f.name)} · ${mb(f)}${M.validate(f)?`<p class="file-warning">${M.validate(f)==='type'?C.wrongType:C.overLimit}</p>`:''}</li>`).join('')}</ul><p id="upload-message" role="status"></p><div class="dialog-actions"><button class="button" id="upload-close">${C.cancel}</button><button class="button primary" id="start-upload" ${uploadBusy||!candidates.some(f=>!M.validate(f))?'disabled':''}>${uploadBusy?C.uploading:C.startUpload}</button></div>`;if(!$('#upload-dialog').open)$('#upload-dialog').showModal();}
async function uploadOne(f,retry=false){if(f.status==='uploading'&&retry)return;f.status='uploading';save();paint();await new Promise(r=>setTimeout(r,1100));if(!data.own.includes(f))return;if(state==='upload-failed'&&!retry){f.status='failed';AppShell.notify(C.uploadNoticeError+' '+f.name)}else{f.status='ready';f.uploadedAt=new Date().toISOString();AppShell.notify(C.uploadFinished+' '+f.name)}save();paint();}
async function startUpload(){if(uploadBusy)return;const valid=candidates.filter(f=>!M.validate(f));if(!valid.length){$('#upload-message').textContent=C.noFileSelected;return}uploadBusy=true;uploadPanel();const added=candidates.map(f=>{const error=M.validate(f),item={id:'u-'+uid(),name:f.name,type:f.type,size:f.size,account,ownerId:'me',uploader:C.me,institution:account==='personal'?null:C.institutionAccount,uploadedAt:new Date().toISOString(),privateFlag:ownership,activeJobs:[],status:error?'invalid':'queued',error};fileObjects.set(item.id,f.file);data.own.unshift(item);return item});save();candidates=[];$('#upload-dialog').close();paint();await Promise.all(added.filter(f=>!f.error).map(f=>uploadOne(f)));uploadBusy=false;if($('#upload-dialog').open)uploadPanel();paint();}
function preview(f,platform=false){if(!f)return;$('#file-title').textContent=f.name;$('#file-body').innerHTML=`<p>${C.previewHelp}</p>${platform?`<p>${C.readOnly}</p><p>${f.kind} · ${C.grade6} · ${f.subject}</p>`:metadata(f)}<img class="source-preview" src="${SOURCE_PREVIEW}" alt="${C.filePreview}" width="708" height="1000"><button class="button" id="file-close">${C.cancel}</button>`;$('#file-dialog').showModal();$('#file-title').focus()}
function deletion(id){deleteFileId=id;const f=data.own.find(x=>x.id===id);if(!f)return;const allowed=canDelete(f);$('#delete-title').textContent=C.deleteTitle;$('#delete-body').innerHTML=`<p class="file-name">${esc(f.name)}</p><p>${C.deleteHelp}</p>${!allowed?`<div class="page-error" role="alert"><p>${C.inUse}</p><a class="text-link" href="${useLink(f)}">${C.inUseWork} ${esc(useName(f))}</a></div>`:''}<p id="delete-message" role="status">${deleteMessage}</p><div class="dialog-actions"><button class="button" id="delete-cancel" ${deleteBusy?'disabled':''}>${C.cancel}</button><button class="button destructive" id="confirm-delete" ${!allowed||deleteBusy?'disabled':''} aria-busy="${deleteBusy}">${deleteBusy?C.deleting:C.confirmDelete}</button></div>`;if(!$('#delete-dialog').open)$('#delete-dialog').showModal();$('#delete-title').focus()}
async function removeFile(){if(deleteBusy)return;const f=data.own.find(x=>x.id===deleteFileId);if(!canDelete(f)){deletion(deleteFileId);return}deleteBusy=true;deletion(deleteFileId);await new Promise(r=>setTimeout(r,650));if(!canDelete(f)){deleteBusy=false;deletion(deleteFileId);return}if(state==='delete-error'){deleteBusy=false;deleteMessage=C.deleteError;deletion(deleteFileId);return}data.own=data.own.filter(x=>x.id!==f.id);save();deleteBusy=false;deleteMessage='';message=C.deleted;$('#delete-dialog').close();paint();$('#library-message').focus()}
document.addEventListener('submit',e=>{if(e.target.id==='library-search'){e.preventDefault();query=$('#library-query').value;visible=10;paint()}});
document.addEventListener('change',e=>{if(e.target.id==='ownership-check')ownership=e.target.checked;if(e.target.id==='new-files'){candidates=Array.from(e.target.files||[]).map(f=>({file:f,name:f.name,type:f.type,size:f.size}));uploadPanel()}});
document.addEventListener('click',async e=>{const el=e.target.closest('button,a');if(!el||el.disabled)return;if(el.id==='add-file'){candidates=[];uploadPanel();return}if(el.id==='upload-close'){$('#upload-dialog').close();$('#add-file')?.focus();return}if(el.id==='start-upload'){await startUpload();return}if(el.dataset.platformView){preview(M.visiblePlatform(data.platform,data.entitlements).find(f=>f.id===el.dataset.platformView),true);return}if(el.dataset.ownView){preview(M.visibleOwn(data.own,account).find(f=>f.id===el.dataset.ownView));return}if(el.id==='file-close'){$('#file-dialog').close();return}if(el.dataset.delete){deletion(el.dataset.delete);return}if(el.id==='delete-cancel'){$('#delete-dialog').close();return}if(el.id==='confirm-delete'){await removeFile();return}if(el.dataset.uploadRetry){const f=data.own.find(x=>x.id===el.dataset.uploadRetry);if(f&&f.account===account&&!M.validate(f))await uploadOne(f,true);return}if(el.dataset.selectOther){candidates=[];uploadPanel();return}if(el.dataset.removeCandidate){data.own=data.own.filter(x=>x.id!==el.dataset.removeCandidate||x.account!==account||x.status==='ready');save();paint();return}if(el.id==='more-files'){visible+=10;paint();return}if(el.id==='data-retry'){view='normal';paint();return}if(el.dataset.panel){panel(el.dataset.panel);return}if(el.id==='panel-close'){closePanel();return}if(el.id==='credit'||el.dataset.page){const url=AppShell.destination(el.id==='credit'?'credits':el.dataset.page);if(url)location.href=url;else $('#live').textContent=C.notConnected;return}if(el.hasAttribute('data-logout'))$('#live').textContent=C.notConnected});
$('#delete-dialog').addEventListener('cancel',e=>{if(deleteBusy)e.preventDefault()});
paint();if(['delete-confirm','delete-blocked','delete-error'].includes(state))deletion(state==='delete-blocked'?'u2':'u1');
})();
</script></body></html>
