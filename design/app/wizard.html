function barrierReason(){if(draft.legacySubjectHold)return C.legacyHoldNotice;if(confirmation==='done')return '';if(confirmation==='pending')return C.confirmPending;if(confirmation==='error')return C.confirmError;if(stale)return C.staleHelp;if(memberView&&ledger.balance<currentQuote().total&&spendable()>=currentQuote().total)return C.walletUnavailable;const short=Math.max(0,currentQuote().total-spendable());return short?C.short+' '+bn(short)+' '+C.credit+'। '+contact():D.validate(draft,9)?C.fixtureMissing:''}

async function makeSample(retry=false){if(samplePending)return false;const sq=QuoteModel.sampleQuote(draft),k=sampleKey();if(spendable()<sq.total&&!ledger.results[k]){sampleError=false;return false}samplePending=true;render();await new Promise(r=>setTimeout(r,1200));if(state==='sample-error'&&!retry){sampleError=true;samplePending=false;render();return false}try{const result=QuoteModel.debit(ledger,k,sq.total);if(!result.ok)return false;persistLedger();draft.sampleReceipt=result;changed();sampleError=false;return true}catch{sampleError=true;return false}finally{samplePending=false;render()}}

function requestLeave(target=AppShell.destination('home')){
 if(confirmation==='pending'){announce(C.pendingHelp);return}
 leaveTarget=target;leaveAttempt++;leaveTrigger=document.activeElement;if(!dirty()&&pending===0){goLeave();return}if($('#panel').open)closePanel();$('#leave-description').textContent=C.leaveUnsaved;$('#leave-dialog').showModal();$('#leave-stay').focus();
}
function goLeave(){leaving=true;leaveAttempt++;clearTimeout(timer);location.href=leaveTarget}
function resizeFooter(){const f=$('#wizard-footer');if(f)document.documentElement.style.setProperty('--wizard-footer-height',(f.getBoundingClientRect().height+($('#footer-reason')?.textContent?$('#footer-reason').getBoundingClientRect().height:0))+'px')}
function keyboard(){const v=window.visualViewport;const inset=v?Math.max(0,innerHeight-v.height-v.offsetTop):0;document.documentElement.style.setProperty('--keyboard-inset',inset+'px');resizeFooter()}
document.body.insertAdjacentHTML('beforeend',`<footer class="wizard-footer" id="wizard-footer"><div class="wizard-footer-inner"><p class="footer-reason" id="footer-reason"></p><div class="save-line" id="save-line"><span id="footer-step" hidden></span><span id="save-label" role="status" aria-live="polite"></span><button class="button" id="save-retry" hidden>${C.retrySave}</button></div><div class="wizard-actions"><button class="button ghost back" id="wizard-prev">${C.back}</button><button class="button primary next" id="wizard-next">${C.next}</button></div></div></footer><dialog class="leave-dialog" id="leave-dialog" role="alertdialog" aria-labelledby="leave-title" aria-describedby="leave-description"><h2 id="leave-title">${C.leaveTitle}</h2><p id="leave-description"></p><div class="leave-actions"><button class="button" id="leave-stay">${C.stay}</button><button class="button primary" id="leave-save">${C.saveLeave}</button><button class="button quiet" id="leave-now">${C.leaveNow}</button></div></dialog>`);
document.addEventListener('change',e=>{const el=e.target;if(!el.matches('#workspace input')&&el.id!=='catalog-group')return;
 if(el.id==='wizard-ownership'){uploadOwn=el.checked;return}
 if(el.name==='option'){const values=draft.options[tab]||[];draft.options[tab]=el.checked?[...new Set([...values,el.value])]:values.filter(x=>x!==el.value)}
 if(el.name==='sampleCount'){draft.sampleCount=Number(el.value);draft.samples={};if(!draft.sampleCount)draft.aiSample=false}
 if(el.name==='samplePages')draft.samplePages=Number(el.value);
 if(el.name==='aiSample')draft.aiSample=el.checked;
 if(el.name==='sample'){draft.samples[tab]=el.value}
 if(el.id==='file-input'){Array.from(el.files||[]).forEach(f=>addUpload(f));return}
 
 if(el.id==='catalog-group'){const target=CM.entries(CS).find(x=>x.groupId===el.value&&CM.product(CS,x).kind===draft.kind&&CM.open(x));pickCatalog(target);return}
 if(el.name==='kind'){pickCatalog(CM.entry(CS,el.dataset.catalogEntry)||CM.first(CS,el.value));return}
 if(el.name==='subject'){if(!openSubjects.includes(el.value)||unavailable)return;draft=D.subjectChange(draft,el.value,el.checked)}
 if(el.name==='lesson')draft.lessons=el.checked?[...new Set([...draft.lessons,el.value])]:draft.lessons.filter(s=>s!==el.value);
 if(el.name==='template')draft.template=el.value;
 invalid=null;changed();render();
 const same=$('#workspace input[value="'+el.value+'"]');same?.focus();
});
document.addEventListener('input',e=>{if(e.target.id==='catalog-search'){const caret=e.target.selectionStart;catalogSearch=e.target.value;render();const input=$('#catalog-search');input.focus();try{input.setSelectionRange(caret,caret)}catch{}return}if(e.target.id==='preset-name')presetName=e.target.value;if(e.target.id==='extra-notes'){draft.notes=e.target.value;changed()}});
document.addEventListener('click',async e=>{
 const el=e.target.closest('button,a');if(!el||el.disabled)return;if(['members','tools','usage'].includes(el.dataset.page)){const url=AppShell.destination(el.dataset.page);if(url)requestLeave(url);return}
 if(el.dataset.catalogPreview){openCatalogSample(el.dataset.catalogPreview);return}
 if(el.dataset.catalogScroll){document.getElementById('catalog-row-'+el.dataset.catalogScroll)?.scrollBy({left:Number(el.dataset.dir)*300,behavior:'auto'});return}
 if(el.id==='catalog-sample-close'){closeCatalogSample();return}
 if(el.id==='catalog-sample-pick'){const e=CM.entry(CS,catalogEntry);if(!CM.open(e)||navPending||['loading','error'].includes(sampleState))return;pickCatalog(e);closeCatalogSample(true);return}
 if(el.id==='catalog-options-more'){const os=CM.options(CS,CM.entry(CS,catalogEntry),CATALOG_OPTIONS,sampleState),first=os[catalogOptionLimit];catalogOptionLimit+=5;paintCatalogSample();if(first)document.getElementById('catalog-option-'+first.id)?.focus();return}
 if(el.id==='catalog-sample-retry'){sampleState='normal';paintCatalogSample();$('#catalog-sample-title').focus();return}
 if(await extraClick(el))return;
 if(el.id==='wizard-next'){
  if(step===9&&confirmation==='done'){location.href='job.html?step=10&account='+(account==='personal'?'personal':'institution')+'&job='+encodeURIComponent(id);return}if(navPending||samplePending||confirmation==='pending')return;
  invalid=D.validate(draft,step);const activeSubjects=CAT.subjects.filter(s=>s.purchased&&draft.subjects.includes(s.id)).map(s=>s.id);if(step===1&&(!draft.kind||!CM.entries(CS).some(e=>CM.open(e)&&CM.product(CS,e).kind===draft.kind)||draft.catalogSelection&&!CM.open(CM.entry(CS,draft.catalogSelection.entryId)||{})))invalid='kind';if(step===2&&!activeSubjects.length)invalid='subjects';if(step===3&&activeSubjects.some(x=>!draft.lessons.some(k=>k.slice(0,k.lastIndexOf('-'))===x)))invalid='lessons';if(step===5&&!CAT.templates.some(t=>t.id===draft.template)&&!(state==='many'&&/^sample-\d+$/.test(draft.template||'')))invalid='template';if(invalid){render();$('#workspace input:not(:disabled)')?.focus();return}
  navPending=true;render();try{if(step===9){await confirmHold();return}if(step===7&&draft.aiSample&&draft.sampleCount>0){if(!await makeSample())return}const next=step===7&&draft.sampleCount===0?9:step+1;await save(next);step=next;draft.step=step;invalid=null;render(true)}catch{}finally{navPending=false;render()}return;
 }
 if(el.id==='wizard-prev'){if(step>1){step=step===9&&draft.sampleCount===0?7:step-1;draft.step=step;invalid=null;changed();render(true)}return}
 if(el.id==='save-retry'){try{await save()}catch{}return}
 if(el.id==='wizard-exit'){requestLeave();return}
 if(el.id==='leave-stay'){leaveAttempt++;$('#leave-dialog').close();if(leaveTrigger?.isConnected)leaveTrigger.focus();else $('#wizard-exit').focus();return}
 if(el.id==='leave-now'){goLeave();return}
 if(el.id==='leave-save'){const attempt=++leaveAttempt;el.disabled=true;try{await save();if(!leaving&&$('#leave-dialog').open&&attempt===leaveAttempt)goLeave()}catch{if($('#leave-dialog').open&&attempt===leaveAttempt)$('#leave-description').textContent=C.saveFailed}finally{el.disabled=false}return}
 if(el.id==='show-steps'){if($('#panel').open)closePanel();$('#panel-title').textContent=C.allSteps;$('#panel-description').textContent=C.stepsReadonly;$('#panel-body').innerHTML='<ol class="steps-list" role="list">'+CAT.steps.map((s,i)=>'<li class="'+(i+1===step?'current':'')+'">'+bn(i+1)+' · '+s+'<small>'+(i+1===step?C.currentStep:i+1<step?C.previousStep:C.laterStep)+'</small></li>').join('')+'</ol>';trigger=el;$('#panel').showModal();$('#panel-close').focus();return}
 if(el.dataset.panel){if($('#panel').open)$('#panel').close();panel(el.dataset.panel);return}
 if(el.id==='panel-close'){closePanel();return}
 if(el.id==='credit'){requestLeave(AppShell.destination('credits'));return}if(el.dataset.page){if(['credits','library','sources'].includes(el.dataset.page)){requestLeave(AppShell.destination(el.dataset.page));return}if(el.dataset.page==='reviews'){requestLeave('review-list.html?scope='+(account==='personal'?'personal':'org_teacher'));return}if(el.dataset.page==='wizard')return;if(el.dataset.page==='home'||el.dataset.page==='jobs')requestLeave(AppShell.destination(el.dataset.page));else announce(C.demoDestination);return}
 if(el.id==='credit'||el.hasAttribute('data-logout')||el.hasAttribute('data-account')){announce(C.demoDestination);return}
 if(el.hasAttribute('data-notice-open')){e.preventDefault();announce(C.demoDestination);return}
 if(el.hasAttribute('data-retry-catalog')){catalogError=false;render(true);}
});
$('#catalog-sample').addEventListener('cancel',e=>{e.preventDefault();closeCatalogSample()});
document.addEventListener('keydown',e=>{if(e.target.classList?.contains('catalog-row')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();if(e.key==='Home'||e.key==='End')e.target.scrollTo({left:e.key==='Home'?0:e.target.scrollWidth,behavior:'auto'});else e.target.scrollBy({left:e.key==='ArrowRight'?300:-300,behavior:'auto'})}});
$('#leave-dialog').addEventListener('cancel',e=>{e.preventDefault();leaveAttempt++;$('#leave-dialog').close();if(leaveTrigger?.isConnected)leaveTrigger.focus();else $('#wizard-exit').focus()});
addEventListener('beforeunload',e=>{if(!leaving&&(dirty()||pending)){e.preventDefault();e.returnValue=''}});
new ResizeObserver(resizeFooter).observe($('#wizard-footer'));window.visualViewport?.addEventListener('resize',keyboard);window.visualViewport?.addEventListener('scroll',keyboard);addEventListener('resize',keyboard);
if(account==='institution-demo'){currentAccount='নমুনা শিক্ষালয়';updateAccount()}if(draft.holdReceipt)confirmation='done';else if(draft.confirmIntent)confirmation='error';if(window.AppShell)AppShell.beforeAccountSwitch=url=>{requestLeave(url);return false};render();if(step===9&&barrierReason())requestAnimationFrame(()=>$('#confirm-barrier')?.focus());AccountPolicy.paint(account,state);keyboard();document.fonts.ready.then(resizeFooter);if(draft.subjectMigration&&!beforeMigration.subjectMigration&&!denied&&!loading&&!catalogError)save().catch(()=>{});
})();
</script></body></html>
