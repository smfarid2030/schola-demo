<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schola কন্টেন্ট স্টুডিও — মোবাইল নমুনা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#515ECE;--blue2:#2E3591;--navy:#1E2366;--mag:#D6336C;--mag2:#C2368F;
  --bg:#FBF8F3;--ink:#1A1B2E;--muted:#5B5F7E;--line:#E6E3F1;--tint:#EEF0FC;--sun:#F2C14E;--coral:#F08A6C;
  --grad:linear-gradient(135deg,#515ECE 0%,#7A4FC4 55%,#D6336C 100%);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#E9E6F3}
body{font-family:'Hind Siliguri',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3,.disp{font-family:'Baloo Da 2','Hind Siliguri',sans-serif;line-height:1.25;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(30,35,102,.12);display:flex;flex-direction:column}
.flowbar{display:flex;align-items:stretch;gap:6px;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:25}
.flowbar button{min-width:44px;min-height:44px;border-radius:12px;background:var(--tint);color:var(--blue2);font-size:24px;font-weight:700;line-height:1}
.flowbar button[disabled]{opacity:.35}
.flowbar .mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;font-size:14px;padding:2px 12px;text-align:left;background:#F6F4FB}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:80;opacity:0;transition:.25s;max-width:92%;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:80;opacity:0;transition:.25s;max-width:92%;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* top bar */
.top{position:relative;z-index:20;background:var(--grad);color:#fff;padding:calc(10px + var(--safe-t)) 14px 10px;display:flex;align-items:center;gap:10px}
.top img{height:28px;display:block}
.top .grow{flex:1;min-width:0}
.top .ctx{font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;color:#fff;white-space:nowrap}
.rolebar{display:flex;gap:6px;padding:8px 14px;background:var(--navy);overflow-x:auto;scrollbar-width:none}
.rolebar::-webkit-scrollbar{display:none}
.rolebar button{flex:none;color:#C9CCF2;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid #3A408A}
.rolebar button[aria-pressed="true"]{background:#fff;color:var(--navy);font-weight:700;border-color:#fff}
.tape{height:4px;background:repeating-linear-gradient(90deg,var(--mag) 0 18px,var(--sun) 18px 26px)}
main{flex:1;padding:16px 14px calc(96px + var(--safe-b))}
main.wiz{padding-bottom:calc(150px + var(--safe-b))}
/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-b))}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);text-decoration:none;padding:4px 0;border-radius:12px;min-height:48px;justify-content:center}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--blue);font-weight:700}
.nav a.plus span.b{width:46px;height:46px;border-radius:16px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px rgba(81,94,206,.35);margin-top:-18px}
/* cards & bits */
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card.dark{background:var(--grad);color:#fff;border:0}
.card.soft{background:var(--tint);border-color:#DADDF7}
.card.warn{background:#FFF7E0;border-color:#F5DE9C}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.big{font-family:'Baloo Da 2';font-size:34px;font-weight:800;line-height:1}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px}
.sec h2{font-size:18px}
.sec a{font-size:13px;color:var(--blue);font-weight:600;text-decoration:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;padding:0 16px;font-weight:700;width:100%;text-decoration:none}
.btn.pri{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue2)}
.btn.mag{background:var(--mag);color:#fff;box-shadow:0 4px 0 #9E1F4E}
.btn.ghost{background:#fff;color:var(--blue2);border:1.5px solid #C9CDF3}
.btn.white{background:#fff;color:var(--blue2)}
.btn svg{width:20px;height:20px;flex:none}
.btn[disabled]{opacity:.45}
.btn.sm{min-height:38px;width:auto;font-size:13.5px;border-radius:11px;padding:0 12px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--tint);color:var(--blue2);white-space:nowrap}
.tag.run{background:#FCE4EE;color:#9E1F4E}.tag.wait{background:#FFF1C9;color:#6B4E00}.tag.ok{background:#E3F4E8;color:#1E6B3A}.tag.off{background:#EEEEF2;color:#5B5F7E}.tag.fail{background:#FDE3DC;color:#9A3412}
.list .item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.list .item .grow{flex:1;min-width:0}
.ttl{font-weight:700;font-size:15px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;background:#E6E3F1;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px}
.ftype{width:42px;height:48px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--ink);flex:none;border:1.5px solid var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13.5px;min-height:38px}
.tabs button[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right}
.mascot{width:76px;height:76px;flex:none}
.mascot svg{width:100%;height:100%}
.say{position:relative;background:#fff;border:1.5px solid var(--ink);border-radius:16px;padding:9px 12px;font-size:14px;font-weight:500}
.say:before{content:"";position:absolute;left:-9px;top:20px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.say:after{content:"";position:absolute;left:-6px;top:21px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.hex{position:absolute;opacity:.15;pointer-events:none}
.note{font-size:12.5px;color:var(--muted);background:#fff;border:1px dashed #CFCBE3;border-radius:12px;padding:10px 12px;margin-top:10px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:48px;border:1.5px solid #D5D2E6;border-radius:12px;padding:10px 12px;background:#fff;font-size:16px}
.toggle{width:46px;height:28px;border-radius:99px;background:#E3E5F2;position:relative;flex:none;transition:.2s}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.toggle[aria-checked="true"]{background:var(--blue)}
.toggle[aria-checked="true"]:after{left:21px}
.pick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px;min-height:56px}
.pick[aria-pressed="true"]{border-color:var(--blue);background:#E4E6FA;box-shadow:4px 4px 0 var(--blue)}
.pick .box{width:24px;height:24px;border-radius:8px;border:2px solid #B9BEEA;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.pick[aria-pressed="true"] .box{background:var(--blue);border-color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700}
.pill[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
/* wizard */
.wtop{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px 12px;position:relative;z-index:1}
.dots{display:flex;gap:4px;margin-top:8px}
.dots i{flex:1;height:6px;border-radius:99px;background:#E6E3F1}
.dots i.d{background:var(--blue)}.dots i.c{background:var(--sun)}.dots i.s{background:repeating-linear-gradient(90deg,#E6E3F1 0 3px,#fff 3px 6px)}
.wact{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(12px + var(--safe-b));z-index:30;box-shadow:0 -6px 18px rgba(30,35,102,.08)}
.wact .row{gap:10px}
.wact .hint{font-size:12px;color:var(--muted);text-align:center;margin-bottom:6px;min-height:16px}
.stage{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;margin-bottom:6px;background:#fff;border:1px solid var(--line)}
.stage .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,22,50,.45);z-index:50;display:none}
.sheet{position:fixed;left:50%;transform:translate(-50%,100%);bottom:0;width:100%;max-width:480px;background:#fff;border-radius:22px 22px 0 0;z-index:60;padding:10px 16px calc(20px + var(--safe-b));transition:transform .25s;max-height:80vh;overflow:auto}
.sheet.open{transform:translate(-50%,0)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#D5D2E6;margin:0 auto 12px}
.sheet a.it{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;min-height:52px}
.sheet a.it small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.ico{width:38px;height:38px;border-radius:12px;background:var(--tint);display:grid;place-items:center;color:var(--blue2);flex:none}
.ico svg{width:20px;height:20px}
.page-h{margin:2px 2px 14px}
.page-h h1{font-size:23px}
.page-h p{margin:4px 0 0;color:var(--muted);font-size:14px}
.demo{display:inline-block;font-size:11px;font-weight:700;color:#9E1F4E;background:#FCE4EE;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.pin{width:24px;height:24px;border-radius:50%;background:var(--mag);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;flex:none;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.paper{background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:12px;position:relative;font-size:13px}
.seg{display:flex;background:#EFEDF7;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;min-height:38px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--blue2);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.hero{position:relative;overflow:hidden}
.login-wrap{min-height:calc(100vh - 57px);display:flex;flex-direction:column;background:var(--grad);color:#fff}
.login-wrap .inner{padding:calc(28px + var(--safe-t)) 20px 20px;flex:1;display:flex;flex-direction:column}
a.link{color:var(--blue);font-weight:600;text-decoration:none}
@media (min-width:520px){body{padding:16px 0}.app{border-radius:28px;overflow:hidden;min-height:calc(100vh - 32px)}}
</style>
<!-- wide:START head -->
<meta name="robots" content="noindex,nofollow">
<style>
/* ===== wide: prototype banner (all sizes) ===== */
:root{--pb:28px}
.proto-banner{height:var(--pb);line-height:var(--pb);background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px}
.app{min-height:calc(100vh - var(--pb))}
.login-wrap{min-height:calc(100vh - 57px - var(--pb))}
@media (min-width:520px){.proto-banner{margin:-16px 0 16px}.app{min-height:calc(100vh - 32px - var(--pb))}}

/* ===== wide: markup added for wide screens stays invisible on phones ===== */
.side,.wside,.dt-h{display:none}
.dtw,.rd-doc,.rd-notes{display:contents}

/* ===== wide: 768px and up (tablet: icon sidebar, one readable column) ===== */
@media (min-width:768px){
  body{padding:0}
  .proto-banner{margin:0}
  .app{max-width:1280px;border-radius:0;overflow:visible;min-height:calc(100vh - var(--pb));display:grid;grid-template-columns:92px minmax(0,1fr);grid-template-rows:auto auto auto auto auto 1fr auto}
  .top{grid-column:1/-1;grid-row:1}
  .rolebar{grid-column:1/-1;grid-row:2}
  .tape{grid-column:1/-1;grid-row:3}
  .flowbar{grid-column:1/-1;grid-row:4}
  .nav{display:none}
  main{grid-column:2;grid-row:5/8;min-width:0;padding:22px max(22px,calc((100% - 720px)/2)) 48px}
  /* login + forgot */
  .login-wrap{grid-column:1/-1;grid-row:5/8;min-height:0}
  .login-wrap .inner{width:100%;max-width:520px;margin:0 auto;justify-content:center}
  .login-wrap form{margin-top:18px!important}
  /* sidebar (icons with small labels) */
  .side{display:block;grid-column:1;grid-row:5/8;background:#fff;border-right:1px solid var(--line)}
  .side nav{position:sticky;top:57px;max-height:calc(100vh - 57px);overflow-y:auto;padding:10px 6px 20px;scrollbar-width:thin}
  .side a{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;font-size:11px;line-height:1.25;color:var(--muted);text-decoration:none;padding:8px 2px;border-radius:12px;min-height:52px;justify-content:center;margin-bottom:2px}
  .side a .si{display:grid;place-items:center;flex:none}
  .side a svg{width:22px;height:22px;display:block}
  .side a small{display:none}
  .side a[aria-current="page"]{color:var(--blue);font-weight:700;background:var(--tint)}
  .side a.plus .si{width:42px;height:42px;border-radius:15px;background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(81,94,206,.35)}
  .side-h{font-size:11px;font-weight:700;color:var(--mag);text-align:center;border-top:1px solid var(--line);margin:8px 4px 6px;padding-top:8px}
  /* wizard: no menu (as in the original), content in a readable centred column */
  .wtop{grid-column:1/-1;grid-row:5;padding-left:max(14px,calc((100% - 652px)/2));padding-right:max(14px,calc((100% - 652px)/2))}
  main.wiz{grid-column:1/-1;grid-row:6;padding:20px max(20px,calc((100% - 640px)/2)) 28px}
  .wact{grid-column:1/-1;grid-row:7;position:sticky;bottom:0;left:auto;transform:none;width:auto;max-width:none;padding-left:max(14px,calc((100% - 652px)/2));padding-right:max(14px,calc((100% - 652px)/2))}
}

/* ===== wide: 1024px and up (full width, labelled sidebar, grids and tables) ===== */
@media (min-width:1024px){
  .app{grid-template-columns:248px minmax(0,1fr)}
  .app[data-scr="wizard"]{grid-template-columns:312px minmax(0,1fr)}
  /* sidebar with labels */
  .side nav{padding:14px 12px 24px}
  .side a{flex-direction:row;justify-content:flex-start;text-align:left;gap:12px;font-size:14.5px;padding:8px 12px;min-height:46px}
  .side a small{display:block;font-size:12px;font-weight:400;color:var(--muted);line-height:1.3}
  .side a.plus .si{width:36px;height:36px;border-radius:12px;margin-left:-7px;margin-right:-7px}
  .side-h{text-align:left;margin:10px 12px 6px;font-size:12px}
  /* wizard side panel: steps, current choices, credit estimate */
  .wside{display:block;grid-column:1;grid-row:5/8;background:#fff;border-right:1px solid var(--line)}
  .wside>div{position:sticky;top:57px;max-height:calc(100vh - 57px);overflow-y:auto;padding:16px 14px 24px;scrollbar-width:thin}
  .wside .ws-h{font-weight:700;margin:14px 4px 6px}
  .wsteps{list-style:none;margin:0 0 14px;padding:0}
  .wsteps li{display:flex;align-items:center;gap:10px;font-size:14px;padding:5px 8px;border-radius:10px;color:var(--muted)}
  .wsteps .n{width:24px;height:24px;border-radius:50%;border:1.5px solid #C9CDF3;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;background:#fff}
  .wsteps li.d{color:var(--ink)}
  .wsteps li.d .n{background:var(--blue);border-color:var(--blue);color:#fff}
  .wsteps li.c{background:#FFF7E0;color:var(--ink);font-weight:700}
  .wsteps li.c .n{background:var(--sun);border-color:var(--sun);color:var(--ink)}
  .wsteps li.s{opacity:.45}
  .wsteps li.s .n{border-style:dashed}
  .wside .card{margin-bottom:10px}
  .wside .kv{margin-top:8px;font-size:13.5px}
  .wtop,main.wiz,.wact{grid-column:2}
  /* page grid */
  main{padding:24px 28px 48px}
  main[data-scr]{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 16px;align-content:start;align-items:start}
  main[data-scr]>*{grid-column:1/-1;margin-top:0;margin-bottom:0;min-width:0}
  main[data-scr]>.tabs{margin:0;padding:0}
  main[data-scr]>.sec{margin:6px 2px 0}
  main[data-scr]>.page-h{margin:0 2px 2px}
  main[data-scr]>.btn,main[data-scr]>button.row{justify-self:start;width:auto}
  main[data-scr]>.btn{min-width:260px}
  /* card lists as tile grids */
  main[data-scr="home"]>.card.list,main[data-scr="library"]>.card.list,main[data-scr="adm-personas"]>.card.list,main[data-scr="adm-tasks"]>.card.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:none;border:0;padding:0}
  main[data-scr="home"]>.card.list>.item,main[data-scr="library"]>.card.list>.item,main[data-scr="adm-personas"]>.card.list>.item,main[data-scr="adm-tasks"]>.card.list>.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
  main[data-scr="adm-personas"]>.card.list{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* tables: my jobs, review list, members, organizations, transactions, price list */
  .dtw{display:block;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .card.list.dt{padding:0;overflow:hidden}
  .dt-h{display:grid;align-items:center;column-gap:16px;padding:10px 18px;background:#F6F4FB;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted)}
  .dt-r{display:grid!important;align-items:center;column-gap:16px;row-gap:0;padding:12px 18px!important;margin:0!important;border:0;border-bottom:1px solid var(--line);border-radius:0;background:#fff}
  .dt-r:last-child{border-bottom:0}
  .dt-work{grid-template-columns:minmax(0,2.2fr) minmax(0,1.7fr) minmax(0,1.5fr) minmax(0,1.3fr) 128px}
  .dt-r.dt-work>.between,.dt-r.dt-work>.between>div{display:contents}
  .dt-r.dt-work .ttl{grid-column:1;grid-row:1}
  .dt-r.dt-work .between>div>.xs{grid-column:2;grid-row:1}
  .dt-r.dt-work .tag{grid-column:3;grid-row:1;justify-self:start}

 if(k.startsWith('wizard:')){const st=+k.split(':')[1];if(S.acct!=='personal'&&S.acct!=='school')S.acct='personal';S.wz.step=st;if(st>=9&&!S.wz.jobId){S.wz.jobId=st===9?'j1':'j3';S.acct='personal';}if(st<9&&S.wz.jobId){const j=S.wz.jobId;S.wz=freshWz();S.wz.step=st;}S.role='teacher';go('wizard');}

  'credits':{rows:'.item[data-row=ledger]',cls:'ledger',cols:['বিবরণ','তারিখ · ধরন','পরিমাণ','ব্যালান্স']},
  'org-members':{rows:'.item[data-row=member]',cls:'member',cols:['','নাম','ইমেইল · রোল','অবস্থা','']},
  'adm-orgs':{rows:'a.card[data-act=P08]',cls:'org',wrap:true,cols:['নাম','ধরন · টুল · পার্সোনা','অবস্থা','ক্রেডিট','']},
  'adm-prices':{rows:'.card.list>.item',cls:'price',cols:['কাজের ধরন','একক','মূল্য']}
 };
 function tables(main,r){
  const t=TABLES[r];if(!t)return;const rows=[...main.querySelectorAll(t.rows)];if(!rows.length)return;
  const head=document.createElement('div');head.className='dt-h dt-'+t.cls;
  head.innerHTML=t.cols.map(c=>`<span>${c}</span>`).join('');
  rows.forEach(x=>x.classList.add('dt-r','dt-'+t.cls));
  let box;
  if(t.wrap){box=document.createElement('div');box.className='dtw';rows[0].before(box);box.append(...rows);}
  else{box=rows[0].parentNode;box.classList.add('dt');}
  box.prepend(head);
 }

 /* review detail: document preview (left) and review notes (right) from 1024px up */
 function splitReview(main){
  const paper=main.querySelector(':scope>.paper');if(!paper)return;
  const kids=[...main.children],i=kids.indexOf(paper);
  const doc=document.createElement('div');doc.className='rd-doc';
  const notes=document.createElement('div');notes.className='rd-notes';
  paper.before(doc);doc.append(...kids.slice(i,i+2));
  main.append(notes);notes.append(...kids.slice(i+2));
 }

 function enhance(){
  const app=document.getElementById('app'),r=route();
  app.dataset.scr=r;
  if(r==='login'||r==='forgot')return;
  if(r==='wizard'){app.insertAdjacentHTML('beforeend',wizSide());return;}
  const main=app.querySelector('main');if(!main)return;
  main.dataset.scr=r;
  app.insertAdjacentHTML('beforeend',sideNav(r));
  tables(main,r);
  if(r==='review-detail')splitReview(main);
 }
 render=function(){baseRender();enhance();};
 enhance();
})();
</script>
